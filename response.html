<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submissions Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loader {
            border-top-color: #ef4444;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-red-600 shadow-md">
            <div class="container mx-auto px-4 py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <i class="fas fa-paper-plane text-white text-2xl mr-3"></i>
                        <h1 class="text-xl md:text-2xl font-bold text-white">AirSaai Admin App</h1>
                    </div>
                    <div class="flex items-center">
                        <button id="refreshBtn" class="bg-white text-red-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center">
                            <i class="fas fa-sync-alt mr-2"></i>
                            <span class="hidden md:inline">Refresh Data</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Stats Overview -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-3">
                        <div class="bg-red-100 p-3 rounded-full mr-4">
                            <i class="fas fa-users text-red-600"></i>
                        </div>
                        <h3 class="text-gray-700 font-semibold">Total Submissions</h3>
                    </div>
                    <p id="totalSubmissions" class="text-2xl font-bold text-gray-800">-</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-3">
                        <div class="bg-red-100 p-3 rounded-full mr-4">
                            <i class="fas fa-calendar text-red-600"></i>
                        </div>
                        <h3 class="text-gray-700 font-semibold">Today's Submissions</h3>
                    </div>
                    <p id="todaySubmissions" class="text-2xl font-bold text-gray-800">-</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-3">
                        <div class="bg-red-100 p-3 rounded-full mr-4">
                            <i class="fas fa-calendar-week text-red-600"></i>
                        </div>
                        <h3 class="text-gray-700 font-semibold">This Week</h3>
                    </div>
                    <p id="weekSubmissions" class="text-2xl font-bold text-gray-800">-</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center mb-3">
                        <div class="bg-red-100 p-3 rounded-full mr-4">
                            <i class="fas fa-calendar-alt text-red-600"></i>
                        </div>
                        <h3 class="text-gray-700 font-semibold">This Month</h3>
                    </div>
                    <p id="monthSubmissions" class="text-2xl font-bold text-gray-800">-</p>
                </div>
            </div>
            
            <!-- Search and Filter -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div class="relative w-full md:w-1/3">
                        <input type="text" id="searchInput" placeholder="Search by name, email, subject..." 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
                        <div class="absolute right-3 top-2.5 text-gray-400">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-1/3">
                        <select id="subjectFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
                            <option value="">Filter by subject</option>
                            <option value="Tour Booking">Tour Booking</option>
                            <option value="Package Inquiry">Package Inquiry</option>
                            <option value="Custom Tour Request">Custom Tour Request</option>
                            <option value="Customer Support">Customer Support</option>
                        </select>
                    </div>
                    
                    <div class="w-full md:w-1/3">
                        <select id="sortSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="name">Name (A-Z)</option>
                            <option value="subject">Subject</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Data Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr class="bg-red-600 text-white">
                                <th class="px-4 py-3 text-left">Timestamp</th>
                                <th class="px-4 py-3 text-left">Name</th>
                                <th class="px-4 py-3 text-left">Email</th>
                                <th class="px-4 py-3 text-left">Phone</th>
                                <th class="px-4 py-3 text-left">Subject</th>
                                <th class="px-4 py-3 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Table content will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Loading and Empty States -->
                <div id="loadingState" class="py-12 flex justify-center items-center hidden">
                    <div class="loader ease-linear rounded-full border-4 border-gray-200 h-12 w-12"></div>
                </div>
                
                <div id="emptyState" class="py-12 text-center hidden">
                    <i class="fas fa-inbox text-gray-300 text-5xl mb-4"></i>
                    <p class="text-gray-500 text-lg">No submissions found.</p>
                </div>
            </div>
            
            <!-- Pagination -->
            <div class="mt-6 flex justify-between items-center">
                <div class="text-sm text-gray-600">
                    Showing <span id="startRecord">0</span>-<span id="endRecord">0</span> of <span id="totalRecords">0</span> records
                </div>
                <div class="flex gap-2">
                    <button id="prevPageBtn" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left mr-1"></i> Previous
                    </button>
                    <button id="nextPageBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        Next <i class="fas fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Message Viewer Modal -->
    <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="border-b px-6 py-4 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">Message Details</h3>
                <button id="closeModal" class="text-gray-600 hover:text-gray-900">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-1">Name:</label>
                    <p id="modalName" class="text-gray-800"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-1">Email:</label>
                    <p id="modalEmail" class="text-gray-800"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-1">Phone:</label>
                    <p id="modalPhone" class="text-gray-800"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-1">Subject:</label>
                    <p id="modalSubject" class="text-gray-800"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-1">Date:</label>
                    <p id="modalDate" class="text-gray-800"></p>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">Message:</label>
                    <div id="modalMessage" class="text-gray-800 p-4 bg-gray-50 rounded-lg"></div>
                </div>
            </div>
            <div class="border-t px-6 py-4 flex justify-end">
                <button id="closeModalBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Application Code
        document.addEventListener('DOMContentLoaded', function() {
            // Configuration
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8xBvTbIezQR77VZN0nVaAS-Lf9VrmY5olOtQYSNGcWYjbgtQGwqjtmgMsqPLASCt7TQ/exec'; // Replace with your script URL
            const RECORDS_PER_PAGE = 10;            
            // State variables
            let allData = [];
            let currentPage = 1;
            let filteredData = [];
            
            // DOM Elements
            const tableBody = document.getElementById('tableBody');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const refreshBtn = document.getElementById('refreshBtn');
            const searchInput = document.getElementById('searchInput');
            const subjectFilter = document.getElementById('subjectFilter');
            const sortSelect = document.getElementById('sortSelect');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const startRecord = document.getElementById('startRecord');
            const endRecord = document.getElementById('endRecord');
            const totalRecords = document.getElementById('totalRecords');
            const totalSubmissions = document.getElementById('totalSubmissions');
            const todaySubmissions = document.getElementById('todaySubmissions');
            const weekSubmissions = document.getElementById('weekSubmissions');
            const monthSubmissions = document.getElementById('monthSubmissions');
            
            // Modal elements
            const messageModal = document.getElementById('messageModal');
            const closeModal = document.getElementById('closeModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalName = document.getElementById('modalName');
            const modalEmail = document.getElementById('modalEmail');
            const modalPhone = document.getElementById('modalPhone');
            const modalSubject = document.getElementById('modalSubject');
            const modalDate = document.getElementById('modalDate');
            const modalMessage = document.getElementById('modalMessage');
            
            // Main function to fetch data
            async function fetchData() {
                try {
                    showLoading();
                    
                    // Using a fake data approach for demonstration
                    // In a real implementation, you'd fetch data from your Google Apps Script
                    const response = await fetch(SCRIPT_URL + '?action=getData');
                    const data = await response.json();
                    
                    allData = data.records;
                    processData();
                    updateStats();
                    hideLoading();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    // For demonstration purposes, generate fake data
                    // generateFakeData();
                    processData();
                    updateStats();
                    hideLoading();
                }
            }
            
            // Generate fake data for demonstration
            function generateFakeData() {
                allData = [];
                const subjects = ['Tour Booking', 'Package Inquiry', 'Custom Tour Request', 'Customer Support'];
                const names = ['John Doe', 'Jane Smith', 'Mike Johnson', 'Sarah Williams', 'David Brown'];
                
                for (let i = 0; i < 45; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() - Math.floor(Math.random() * 30));
                    
                    allData.push({
                        timestamp: date.toISOString(),
                        name: names[Math.floor(Math.random() * names.length)],
                        email: `email${i + 1}@example.com`,
                        phone: `+91 ${Math.floor(Math.random() * 10000000000)}`,
                        subject: subjects[Math.floor(Math.random() * subjects.length)],
                        message: `This is a sample message ${i + 1}. It contains details about the inquiry.`
                    });
                }
            }
            
            // Process and display data
            function processData() {
                applyFilters();
                renderTable();
                updatePagination();
            }
            
            // Apply search, filters, and sorting
            function applyFilters() {
                const searchTerm = searchInput.value.toLowerCase();
                const subjectValue = subjectFilter.value;
                const sortBy = sortSelect.value;
                
                filteredData = allData.filter(item => {
                    const matchesSearch = 
                        item.name.toLowerCase().includes(searchTerm) || 
                        item.email.toLowerCase().includes(searchTerm) || 
                        item.subject.toLowerCase().includes(searchTerm) ||
                        item.message.toLowerCase().includes(searchTerm);
                    
                    const matchesSubject = subjectValue === '' || item.subject === subjectValue;
                    
                    return matchesSearch && matchesSubject;
                });
                
                // Sort data
                filteredData.sort((a, b) => {
                    switch (sortBy) {
                        case 'newest':
                            return new Date(b.timestamp) - new Date(a.timestamp);
                        case 'oldest':
                            return new Date(a.timestamp) - new Date(b.timestamp);
                        case 'name':
                            return a.name.localeCompare(b.name);
                        case 'subject':
                            return a.subject.localeCompare(b.subject);
                        default:
                            return new Date(b.timestamp) - new Date(a.timestamp);
                    }
                });
                
                // Reset to first page when filters change
                currentPage = 1;
            }
            
            // Render the table with data
            function renderTable() {
                tableBody.innerHTML = '';
                
                if (filteredData.length === 0) {
                    showEmptyState();
                    return;
                }
                
                hideEmptyState();
                
                const startIndex = (currentPage - 1) * RECORDS_PER_PAGE;
                const endIndex = Math.min(startIndex + RECORDS_PER_PAGE, filteredData.length);
                
                for (let i = startIndex; i < endIndex; i++) {
                    const item = filteredData[i];
                    const date = new Date(item.timestamp);
                    const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                    
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    
                    row.innerHTML = `
                        <td class="px-4 py-3">${formattedDate}</td>
                        <td class="px-4 py-3">${item.name}</td>
                        <td class="px-4 py-3">${item.email}</td>
                        <td class="px-4 py-3">${item.phone}</td>
                        <td class="px-4 py-3">
                            <span class="inline-block px-2 py-1 text-xs rounded-full ${getSubjectClass(item.subject)}">
                                ${item.subject}
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            <button class="view-message p-2 text-blue-600 hover:text-blue-800" data-index="${i}">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    `;
                    
                    tableBody.appendChild(row);
                }
                
                // Add event listeners to view buttons
                document.querySelectorAll('.view-message').forEach(button => {
                    button.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        showMessageDetails(filteredData[index]);
                    });
                });
            }
            
            // Get style class based on subject
            function getSubjectClass(subject) {
                switch (subject) {
                    case 'Tour Booking':
                        return 'bg-green-100 text-green-800';
                    case 'Package Inquiry':
                        return 'bg-blue-100 text-blue-800';
                    case 'Custom Tour Request':
                        return 'bg-purple-100 text-purple-800';
                    case 'Customer Support':
                        return 'bg-red-100 text-red-800';
                    default:
                        return 'bg-gray-100 text-gray-800';
                }
            }
            
            // Update pagination controls
            function updatePagination() {
                const totalPages = Math.ceil(filteredData.length / RECORDS_PER_PAGE);
                const startIdx = (currentPage - 1) * RECORDS_PER_PAGE + 1;
                const endIdx = Math.min(startIdx + RECORDS_PER_PAGE - 1, filteredData.length);
                
                startRecord.textContent = filteredData.length > 0 ? startIdx : 0;
                endRecord.textContent = endIdx;
                totalRecords.textContent = filteredData.length;
                
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage >= totalPages;
            }
            
            // Update statistics
            function updateStats() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const weekStart = new Date(today);
                weekStart.setDate(today.getDate() - today.getDay());
                
                const monthStart = new Date(today);
                monthStart.setDate(1);
                
                const todayCount = allData.filter(item => {
                    const date = new Date(item.timestamp);
                    return date >= today;
                }).length;
                
                const weekCount = allData.filter(item => {
                    const date = new Date(item.timestamp);
                    return date >= weekStart;
                }).length;
                
                const monthCount = allData.filter(item => {
                    const date = new Date(item.timestamp);
                    return date >= monthStart;
                }).length;
                
                totalSubmissions.textContent = allData.length;
                todaySubmissions.textContent = todayCount;
                weekSubmissions.textContent = weekCount;
                monthSubmissions.textContent = monthCount;
            }
            
            // Show message details in modal
            function showMessageDetails(item) {
                const date = new Date(item.timestamp);
                const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                
                modalName.textContent = item.name;
                modalEmail.textContent = item.email;
                modalPhone.textContent = item.phone;
                modalSubject.textContent = item.subject;
                modalDate.textContent = formattedDate;
                modalMessage.textContent = item.message;
                
                messageModal.classList.remove('hidden');
            }
            
            // UI Helper Functions
            function showLoading() {
                loadingState.classList.remove('hidden');
                emptyState.classList.add('hidden');
                tableBody.innerHTML = '';
            }
            
            function hideLoading() {
                loadingState.classList.add('hidden');
            }
            
            function showEmptyState() {
                emptyState.classList.remove('hidden');
            }
            
            function hideEmptyState() {
                emptyState.classList.add('hidden');
            }
            
            // Event Listeners
            refreshBtn.addEventListener('click', fetchData);
            
            searchInput.addEventListener('input', function() {
                processData();
            });
            
            subjectFilter.addEventListener('change', function() {
                processData();
            });
            
            sortSelect.addEventListener('change', function() {
                processData();
            });
            
            prevPageBtn.addEventListener('click', function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                    updatePagination();
                }
            });
            
            nextPageBtn.addEventListener('click', function() {
                const totalPages = Math.ceil(filteredData.length / RECORDS_PER_PAGE);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                    updatePagination();
                }
            });
            
            closeModal.addEventListener('click', function() {
                messageModal.classList.add('hidden');
            });
            
            closeModalBtn.addEventListener('click', function() {
                messageModal.classList.add('hidden');
            });
            
            messageModal.addEventListener('click', function(e) {
                if (e.target === messageModal) {
                    messageModal.classList.add('hidden');
                }
            });
            
            // Initialize the application
            fetchData();
        });
    </script>
</body>
</html>
